<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SummitTED 2026 — Basılabilir Kapı, Zone, Şirket &amp; Meeting Point QR Kiti</title>
  <link rel="icon" type="image/svg+xml" href="../tedu/assets/submitted-mark.svg">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter+Tight:wght@500;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter Tight', sans-serif; background: #F3F5FA; color: #0B1330; }
    .kit-bar { background: #0B1330; color: #FFF; border-top: 4px solid #E41513; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .kit-wrap { max-width: 1180px; margin: 24px auto; padding: 0 20px 48px; }
    .kit-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .qr-card { background: #FFF; border: 2px solid #0B1330; border-top: 5px solid #E41513; padding: 16px; text-align: center; page-break-inside: avoid; }
    .qr-card small { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; color: #E41513; letter-spacing: 1px; }
    .qr-card strong { display: block; font-family: 'Outfit', sans-serif; font-size: 15px; margin: 4px 0 10px; min-height: 36px; }
    .qr-box { width: 148px; height: 148px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; }
    .qr-box svg { width: 100%; height: 100%; display: block; }
    .btn-print { background: #E41513; color: #FFF; border: none; padding: 10px 18px; font-weight: 800; font-size: 12px; letter-spacing: 0.6px; text-transform: uppercase; cursor: pointer; }
    @media (max-width: 900px) { .kit-grid { grid-template-columns: repeat(2, 1fr); } }
    @media print { .kit-bar { display: none; } body { background: #FFF; } .kit-grid { grid-template-columns: repeat(3, 1fr); } }
  </style>
</head>
<body>
  <header class="kit-bar">
    <div style="display:flex; align-items:center; gap:14px;">
      <img src="../tedu/assets/submitted-logo-ted-white.svg?v=3" alt="SummitTED 2026" style="height:38px;">
      <strong>SAHA QR ETİKET PAKETİ (GİRİŞ ÇADIRLARI · ZONE · ŞİRKET MASASI · MEETING POINTS)</strong>
    </div>
    <div style="display:flex; gap:10px;">
      <a href="./" style="color:#FFF; text-decoration:none; border:1px solid rgba(255,255,255,0.3); padding:9px 14px; font-size:12px; font-weight:700;">&larr; UYGULAMAYA DÖN</a>
      <button type="button" class="btn-print" onclick="window.print()">YAZDIR / PDF KAYDET</button>
    </div>
  </header>

  <main class="kit-wrap">
    <div class="kit-grid" id="qr-kit-grid"></div>
  </main>

  <script src="../tedu/vendor/qrcode.min.js"></script>
  <script src="../tedu/summitted-core.js"></script>
  <script>
    (function () {
      const Core = window.SummitTEDCore;
      const host = document.getElementById('qr-kit-grid');
      if (!Core || !host) return;
      const base = new URL('./', window.location.href).href;
      const cards = [];
      Core.GATES.forEach((g) => cards.push({ type: 'GİRİŞ ÇADIRI', code: g.code, title: g.shortName }));
      Core.ZONES.forEach((z) => cards.push({ type: 'KAMPÜS ZONE', code: z.code, title: z.shortName }));
      ['B-01|ASELSAN Masası', 'B-02|TUSAŞ Masası', 'R-01|Akfen Holding', 'R-02|DenizBank'].forEach((s) => {
        const [code, title] = s.split('|');
        cards.push({ type: 'ŞİRKET MASASI', code, title });
      });
      ['MP-01', 'MP-02', 'MP-03', 'MP-04', 'MP-05', 'MP-06', 'MP-17', 'MP-18'].forEach((mp) => {
        cards.push({ type: 'SLUSH\'D MASA', code: mp, title: `G Blok · ${mp}` });
      });
      cards.forEach((item, i) => {
        const el = document.createElement('div');
        el.className = 'qr-card';
        el.innerHTML = `<small>${item.type} · ${item.code}</small><strong>${item.title}</strong><div class="qr-box" id="qbox-${i}"></div><div style="font-size:11px; color:#52607A;">SummitTED App ile Okutun</div>`;
        host.appendChild(el);
        const qr = window.qrcode(0, 'M');
        qr.addData(`${base}?tab=scan&qr=${encodeURIComponent(item.code)}`);
        qr.make();
        document.getElementById(`qbox-${i}`).innerHTML = qr.createSvgTag({ cellSize: 4, margin: 1, scalable: true });
      });
    })();
  </script>
</body>
</html>

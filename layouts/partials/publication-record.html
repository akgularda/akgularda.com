<article class="publication-record"{{ if .Filter }} data-entry data-search="{{ printf "%s %s %s %s" .Record.title .Record.publisher .Record.notes (.Record.translation | default "") | lower }}" data-year="{{ .Record.year }}" data-type="{{ .Record.type }}"{{ end }}><div class="entry-meta"><span>{{ .Record.type }}</span><span>{{ .Record.date }}</span></div><h3>{{ .Record.title }}</h3>{{ with .Record.translation }}<p class="publication-translation">{{ . }}</p>{{ end }}<p class="publication-publisher">{{ .Record.publisher }}</p>{{ with .Record.notes }}<p>{{ . }}</p>{{ end }}<div class="publication-links">{{ range .Record.links }}<a class="text-link" href="{{ .url }}">{{ .label }} <span aria-hidden="true">↗</span></a>{{ end }}</div></article>
